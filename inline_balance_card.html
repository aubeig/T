<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<style>
@import url('https://fonts.googleapis.com/css2?family=Nunito:wght@800;900&amp;display=swap');
body{background:#0b0b14;color:#f0f0ff;font-family:'Nunito',sans-serif;padding:20px;margin:0;}
.card{max-width:400px;margin:0 auto;background:linear-gradient(170deg,#121220,#1a1028);border:1px solid rgba(112,0,255,0.3);border-radius:28px;padding:20px;box-shadow:0 20px 60px rgba(112,0,255,0.25);}
.tree-row{opacity:0;animation:fadeDown 0.6s ease forwards;display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid rgba(255,255,255,0.05);}
.tree-row:nth-child(1){animation-delay:0.1s;}
.tree-row:nth-child(2){animation-delay:0.2s;}
.tree-row:nth-child(3){animation-delay:0.3s;}
.tree-row:nth-child(4){animation-delay:0.4s;}
@keyframes fadeDown{from{opacity:0;transform:translateY(-12px);}to{opacity:1;transform:translateY(0);}}
.label{font-weight:800;font-size:0.85em;color:#b0a8e8;text-transform:uppercase;letter-spacing:1px;}
.value{font-weight:900;font-size:1.05em;color:#fff;}
.hero{margin-top:14px;text-align:center;}
.hero-num{font-size:2.2em;font-weight:900;background:linear-gradient(135deg,#00F0FF,#8A2BE2,#FFD24A);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
</style>
</head>
<body>
<div class="card">
  <div style="display:flex;align-items:center;gap:12px;margin-bottom:14px;">
    <div style="width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,#7000FF,#00F0FF);display:grid;place-items:center;font-size:1.4em;">💎</div>
    <div><div style="font-weight:900;font-size:1.1em;">Violet Bank</div><div style="font-size:0.75em;color:#b0a8e8;">Баланс · Профиль · Статус</div></div>
  </div>

  <div class="tree-row"><span style="font-family:monospace;color:#00F0FF;font-weight:700;">├─</span><span class="label">Ник</span><span class="value">@user</span></div>
  <div class="tree-row"><span style="font-family:monospace;color:#8A2BE2;font-weight:700;">├─</span><span class="label">Статус</span><span class="value" style="color:#FFD24A;">Золотой</span></div>
  <div class="tree-row"><span style="font-family:monospace;color:#00F0FF;font-weight:700;">├─</span><span class="label">Баланс</span><span class="value">12 480 Viol</span></div>
  <div class="tree-row"><span style="font-family:monospace;color:#FFD24A;font-weight:700;">└─</span><span class="label">Украшение</span><span class="value" style="color:#00F0FF;">Кристалл Небес</span></div>

  <div class="hero"><div class="hero-num">12 480</div><div style="font-weight:700;font-size:0.75em;color:#b0a8e8;letter-spacing:2px;text-transform:uppercase;">Всего Viol</div></div>
</div>
</body>
</html>

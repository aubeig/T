<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<style>
@import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700;900&family=JetBrains+Mono:wght@500&display=swap');
:root { --bg:#0b0b14; --surface:rgba(255,255,255,0.03); --border:rgba(255,255,255,0.10); --text:#f0f0ff; --text-sec:#b0a8e8; --accent:#00F0FF; --accent2:#8A2BE2; --accent3:#FFD24A; --radius:22px; }
body { background:var(--bg); margin:0; padding:24px; font-family:'Outfit',sans-serif; color:var(--text); }
.receipt { max-width:460px; margin:0 auto; background: linear-gradient(160deg, rgba(112,0,255,0.10) 0%, rgba(0,240,255,0.06) 50%, rgba(255,210,74,0.06) 100%); backdrop-filter:blur(24px); border:1px solid rgba(255,255,255,0.10); border-radius:var(--radius); padding:30px 28px 28px; box-shadow:0 24px 70px rgba(112,0,255,0.18), 0 0 0 1px rgba(255,255,255,0.05) inset; position:relative; overflow:hidden; }
.receipt::before { content:''; position:absolute; top:-50%; left:-40%; width:200%; height:180%; background:radial-gradient(circle at 40% 30%, rgba(0,240,255,0.15) 0%, transparent 60%), radial-gradient(circle at 70% 70%, rgba(138,43,226,0.15) 0%, transparent 60%); animation: orbDrift 14s ease-in-out infinite alternate; pointer-events:none; z-index:0; }
@keyframes orbDrift { from { transform:translate(0,0) rotate(0); } to { transform:translate(-3%,3%) rotate(2deg); } }
.header { position:relative; z-index:1; display:flex; align-items:center; gap:14px; margin-bottom:10px; }
.logo { width:48px; height:48px; border-radius:14px; background:linear-gradient(135deg,#7000FF,#8A2BE2,#00F0FF); display:grid; place-items:center; font-size:1.4em; box-shadow:0 0 20px rgba(112,0,255,0.35); }
.title-block h1 { font-weight:900; font-size:1.6em; letter-spacing:-0.5px; margin:0 0 2px; background:linear-gradient(135deg,#00F0FF,#8A2BE2,#FFD24A); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }
.title-block .sub { font-weight:600; color:var(--text-sec); font-size:0.78em; letter-spacing:1px; text-transform:uppercase; }
.badge { display:inline-block; padding:4px 10px; border-radius:999px; font-size:0.7em; font-weight:800; letter-spacing:1px; text-transform:uppercase; background:linear-gradient(135deg,rgba(0,240,255,0.15),rgba(255,210,74,0.15)); border:1px solid rgba(255,255,255,0.12); color:var(--accent); margin-top:4px; }
.divider { height:1px; background:linear-gradient(90deg,transparent,rgba(255,255,255,0.12),transparent); margin:18px 0; position:relative; z-index:1; }
.row { display:flex; justify-content:space-between; align-items:center; padding:7px 0; position:relative; z-index:1; font-size:0.95em; }
.row.label { color:var(--text-sec); font-weight:600; font-size:0.82em; text-transform:uppercase; letter-spacing:1px; }
.row.value { font-weight:800; color:var(--text); }
.total { font-size:1.25em; font-weight:900; background:linear-gradient(135deg,#00F0FF,#8A2BE2); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }
.meta { display:flex; gap:14px; margin-top:14px; font-size:0.82em; color:var(--text-sec); font-weight:600; position:relative; z-index:1; }
.meta span { background:rgba(255,255,255,0.05); padding:3px 10px; border-radius:10px; border:1px solid rgba(255,255,255,0.08); }
.footer { text-align:center; margin-top:18px; font-size:0.75em; color:var(--text-sec); letter-spacing:1px; position:relative; z-index:1; }
</style>
</head>
<body>
<div class="receipt">
  <div class="header">
    <div class="logo">🧾</div>
    <div class="title-block">
      <h1>ЧЕК ВЫДАЧИ</h1>
      <div class="sub">Violet Bank · Промокод / Операция</div>
    </div>
  </div>
  <div style="position:relative;z-index:1;margin-bottom:6px;"><span class="badge">Подтверждено</span></div>

  <div class="divider"></div>
  <div class="row"><span class="label">Операция</span><span class="value">Выдача промокода</span></div>
  <div class="row"><span class="label">Код</span><span class="value" style="font-family:'JetBrains Mono',monospace;color:var(--accent3);">VIO-7X9-K3M</span></div>
  <div class="row"><span class="label">Сумма</span><span class="value">+5 000 Viol</span></div>
  <div class="row"><span class="label">Получатель</span><span class="value">@user_name</span></div>
  <div class="divider"></div>
  <div class="row"><span style="font-weight:800;color:var(--text-sec);">Новый баланс</span><span class="total">17 480 Viol</span></div>
  <div class="divider"></div>
  <div class="meta"><span>📅 08.09.2026</span><span>⏱ 14:32</span><span>💳 Банковая система</span></div>
  <div class="footer">VIOLET BUFFER · MATERIAL YOU EXPENSIVE</div>
</div>
</body>
</html>
